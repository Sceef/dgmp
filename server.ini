; dgmp-server.exe settings. Command-line flags (--name --mode --port --max --password --bind) override these.
[Server]
Name=DGMP Server
Mode=freeroam
Port=7777
MaxPlayers=16
Password=
; Admins (player.admin): SteamIDs (17 digits, 7656...), comma separated. Nicknames count only with SteamAuth=off.
Admins=
; Steam accounts: optional (checked when SteamApiKey is set; players without Steam join unconfirmed)
; | required (only players Steam confirmed) | off (nicknames only, like before)
SteamAuth=optional
; Steam Web API key for the check: https://steamcommunity.com/dev/apikey
SteamApiKey=
; A nickname belongs to the Steam account that played under it first (data/names.json)
ReserveNicks=1
; A player joining from this computer (127.0.0.1) is an admin
LocalAdmin=1
; "/rcon login <password>" in the chat makes a player an admin for the session; empty: RCON off
RconPassword=
; Anti-cheat: largest damage of one reported hit, melee reach (m), hits a second, strikes a minute before a kick (0: never)
MaxHitDamage=500
MeleeRange=6
MaxHitsPerSecond=30
CheatKick=10
; Nametags above players: visible (hidden behind walls) | walls (seen through walls) | hidden
Nametags=visible
; Bind=0.0.0.0
; Weapons on join: none (only knife, rock, taser; the mode gives the rest) | save (the world save's weapons)
StartWeapons=none
; Players' bodies / bikes block each other: off | players | bikes | all
Collisions=off
; Server scripts run in every mode before its own code (scripts/<name>.lua, like SA-MP filterscripts), comma separated
Scripts=
; Modes may call websites and APIs (http.get/post, Discord webhooks): 1 | 0
Http=1
; Master server to be listed on (launcher tab "Internet"): host or host:port (UDP 7700 by default); empty: not listed
Master=
; Spawn point in Unreal units (100 = 1 m)
SpawnX=-85462.8
SpawnY=-301759.8
SpawnZ=-5179.7
SpawnYaw=1.17
